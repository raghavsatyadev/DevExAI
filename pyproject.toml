[project]
name = "devexai"
dynamic = ["version"]
description = "DevExAI: turns chat ideas into reviewed tools for AI coding assistants (Phase 1 pilot)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
]

[project.scripts]
devexai = "devexai.__main__:main"

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/devexai/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/devexai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
